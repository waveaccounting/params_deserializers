version: 2.1

jobs:
  publish-ruby-gem:
    resource_class: small
    docker:
      - image: cimg/ruby:3.3
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_ACCESS_TOKEN
    steps:
      - checkout
      - run:
          name: Build gem
          command: gem build params_deserializers.gemspec --output params_deserializers.gem
      - run:
          name: Publish gem to Gemfury
          command: curl --fail-with-body -F "package=@params_deserializers.gem" "https://repo.fury.io/${GEMFURY_WRITE_TOKEN}/wave/"

workflows:
  main:
    jobs:
      - publish-ruby-gem:
          context:
            - dockerhub
            - gemfury-write-only
          filters:
            branches:
              only: master
